name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Job 1: Compilar, Testear y Publicar Backend
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v5
        with:
          context: ./Trabajo/backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:Trabajo/backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-SistemaReservasBackend.Models.*;-SistemaReservasBackend.DTOs.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/tests.trx

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v5
        with:
          context: ./Trabajo/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nicogrosso19/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Job 2: Compilar, Testear y Publicar Frontend
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Trabajo/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Trabajo/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nicogrosso19/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Job 3: Deploy automático a QA (ejecutando la IMAGEN inmutable vía imgURL)
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/nicogrosso19/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/nicogrosso19/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test QA (espera a que QA responda)
        shell: bash
        env:
          URL_API: https://ingsoft3-tp01-api-qa-new.onrender.com
          URL_FRONT: https://ingsoft3-tp01-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/reservations" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # Job 4: Pruebas de Integración (contra la API real de QA, sin navegador)
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Trabajo/frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        run: npm ci
        working-directory: ./Trabajo/frontend

      - name: Integración contra la API de QA
        env:
          API_BASE_URL: https://ingsoft3-tp01-api-qa-new.onrender.com
        run: npx playwright test e2e/api.spec.js
        working-directory: ./Trabajo/frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: Trabajo/frontend/playwright-report
          retention-days: 7

  # Job 5: Pruebas End-to-End (con navegador Chromium real contra QA)
  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Trabajo/frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./Trabajo/frontend

      - name: E2E contra el frontend de QA
        env:
          E2E_BASE_URL: https://ingsoft3-tp01-front-qa.onrender.com
        run: npx playwright test e2e/reservas.spec.js
        working-directory: ./Trabajo/frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: Trabajo/frontend/playwright-report
          retention-days: 7

  # Job 6: Deploy a Producción con aprobación humana (Gate bloqueado si falla e2e)
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD la MISMA imagen verificada en QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/nicogrosso19/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/nicogrosso19/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD (espera a que PROD responda)
        shell: bash
        env:
          URL_API: https://ingsoft3-tp01-api-prod.onrender.com
          URL_FRONT: https://ingsoft3-tp01-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_API/api/reservations" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1